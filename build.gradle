plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.aid'
version = '0.0.1-SNAPSHOT'
description = 'trAIn-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
    maven { url 'https://repo.spring.io/snapshot' }
}

ext {
    springAiVersion = '1.0.0-M4'
}

dependencies {
    // ===== Core Spring Boot Starters =====
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // ===== JSON Processing =====
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.google.code.gson:gson:2.10.1'

    // ===== AI Integration =====
    // Spring AI OpenAI (Swagger 의존성 제외)
    implementation("org.springframework.ai:spring-ai-openai-spring-boot-starter:${springAiVersion}") {
        exclude group: 'io.swagger.core.v3', module: 'swagger-annotations'
    }

    // ===== Authentication & Authorization =====
    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    implementation 'com.bucket4j:bucket4j-core:8.10.1'
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    implementation 'org.springframework.boot:spring-boot-starter-aop'

    // OAuth2
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // ===== Communication =====
    // Mail
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // ===== Cache & Performance =====
    // Cache
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'

    // Redis
    //implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // ===== Monitoring & Operations =====
    // Actuator
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // ===== Documentation =====
    // SpringDoc (Swagger UI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'

    // ===== Configuration =====
    // Dotenv
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'

    // ===== Code Generation =====
    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // ===== Database =====
    // MariaDB Driver
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'

    // QueryDSL
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    // p6spy (쿼리 로깅)
    implementation 'com.github.gavlyukovskiy:p6spy-spring-boot-starter:1.9.1'

    // ===== JSON Processing =====
    // Jackson (spring-boot-starter-web에 포함되어 있지만 명시적 추가)
    //implementation 'com.fasterxml.jackson.core:jackson-databind'
    //implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // ===== Development Tools =====
    // Devtools
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // ===== Test =====
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'

    // === aws의 ALB 상태 검사를 위해 필요함 ===
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // ===== WebRTC =====
    // WebRTC Java bindings
    //implementation 'org.webrtc:google-webrtc:1.0.32006'
    //implementation 'dev.onvoid.webrtc:webrtc-java:0.7.0'
}

tasks.named('test') {
    useJUnitPlatform()
}

bootJar {
    archiveFileName = 'backend.jar'
}