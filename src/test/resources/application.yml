# ===============================================
# ===== 완전한 테스트 환경 설정 =====
# ===============================================

spring:
  application:
    name: trAIn-backend

  profiles:
    active: test

  # ===== Database Configuration (H2 In-Memory) =====
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  # ===== JPA Configuration =====
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        dialect: org.hibernate.dialect.H2Dialect
        default_batch_fetch_size: 100
    open-in-view: false

  # ===== Spring AI Configuration =====
  ai:
    openai:
      api-key: "test-openai-api-key"
      chat:
        options:
          model: "gpt-4o-mini"
          temperature: 0.7
          max-tokens: 2000

  # ===== Mail Configuration (Mock) =====
  mail:
    host: localhost
    port: 25
    username: "test@example.com"
    password: "test-password"
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  # ===== OAuth2 Configuration (Test Values) =====
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: "test-google-client-id"
            client-secret: "test-google-client-secret"
            scope:
              - profile
              - email
            redirect-uri: "http://localhost:9090/login/oauth2/code/google"
            client-name: Google

          kakao:
            client-id: "test-kakao-client-id"
            client-secret: "test-kakao-client-secret"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:9090/login/oauth2/code/kakao"
            scope:
              - profile_nickname
            client-name: Kakao

          naver:
            client-id: "test-naver-client-id"
            client-secret: "test-naver-client-secret"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "http://localhost:9090/login/oauth2/code/naver"
            scope:
              - name
              - email
            client-name: Naver

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  # ===== Cache Configuration =====
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=100,expireAfterWrite=300s

# ===== Server Configuration =====
server:
  port: 0  # 랜덤 포트 사용 (테스트 시 충돌 방지)
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true

# ===== JWT Configuration =====
jwt:
  secret: "dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItdGVzdGluZy1wdXJwb3NlLW9ubHktMjU2LWJpdHMtdGVzdA"
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

# ===== Cookie Configuration =====
cookie:
  access-token-name: accessToken
  refresh-token-name: refreshToken
  domain: localhost
  path: /
  access-token-max-age: 3600
  refresh-token-max-age: 1209600
  secure: false
  same-site: Lax
  http-only: true

# ===== App Configuration =====
app:
  frontend:
    base-url: "http://localhost:5050"

# ===== CORS Configuration =====
cors:
  allowed-origins: "http://localhost:5050"
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# ===== Actuator Configuration (Disabled for Test) =====
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# ===== Logging Configuration =====
logging:
  level:
    root: WARN
    com.aid.train.backend: INFO
    org.hibernate.SQL: ERROR
    org.springframework.security: WARN
    org.springframework.ai: WARN

# ===== SpringDoc Configuration (Disabled for Test) =====
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ===== Scheduler Configuration =====
scheduler:
  cleanup:
    temporary-data-hours: 1
    refresh-token-days: 14