spring:
  application:
    name: trAIn-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jackson:
    serialization:
      write-dates-as-timestamps: false

  # ===== Database Configuration =====
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:dialogym}?useUnicode=true&characterEncoding=utf8mb4&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
    username: ${DB_USER:root}
    password: ${DB_PASS:mariadb}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ===== JPA Configuration =====
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        use_sql_comments: true
        dialect: org.hibernate.dialect.MariaDBDialect
        default_batch_fetch_size: 100
    open-in-view: false

  # ===== Spring AI Configuration =====
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-4o-mini}
          temperature: ${OPENAI_TEMPERATURE:0.7}
          max-tokens: ${OPENAI_MAX_TOKENS:2000}

  # ===== Mail Configuration =====
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # ===== OAuth2 Configuration =====
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
            redirect-uri: "${OAUTH_REDIRECT_BASE_URL:http://localhost:9090}/login/oauth2/code/google"
            client-name: Google

          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH_REDIRECT_BASE_URL:http://localhost:9090}/login/oauth2/code/kakao"
            scope:
              - profile_nickname
            client-name: Kakao

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH_REDIRECT_BASE_URL:http://localhost:9090}/login/oauth2/code/naver"
            scope:
              - name
              - email
            client-name: Naver

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  # ===== Cache Configuration =====
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=3600s

# ===== Server Configuration =====
server:
  port: ${SERVER_PORT:9090}
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      force: true
  error:
    include-message: always
    include-binding-errors: always
  tomcat:
    max-swallow-size: 10485760
    # WebSocket 설정
    max-http-header-size: 65536
    connection-timeout: 60000


# ===== JWT Configuration =====
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

# ===== Cookie Configuration (HttpOnly) =====
cookie:
  # Cookie 이름
  access-token-name: ${COOKIE_ACCESS_TOKEN_NAME:accessToken}
  refresh-token-name: ${COOKIE_REFRESH_TOKEN_NAME:refreshToken}

  # Cookie 도메인 (로컬: localhost, 프로덕션: .yourdomain.com)
  domain: ${COOKIE_DOMAIN:localhost}

  # Cookie Path
  path: ${COOKIE_PATH:/}

  # Cookie Max Age (초 단위)
  access-token-max-age: ${COOKIE_ACCESS_TOKEN_MAX_AGE:3600}
  refresh-token-max-age: ${COOKIE_REFRESH_TOKEN_MAX_AGE:1209600}

  # Cookie Secure (HTTPS 전용)
  secure: ${COOKIE_SECURE:true}

  # Cookie SameSite (None, Lax, Strict)
  same-site: ${COOKIE_SAME_SITE:None}

  # HttpOnly 강제 적용
  http-only: true

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:5050} # 프론트엔드 기본 URL

# ===== CORS Configuration =====
cors:
  # 환경변수로 오버라이드 가능 (쉼표로 구분)
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5050}
  allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true
  max-age: 3600

# ===== Actuator Configuration =====
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, loggers
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}

# ===== Logging Configuration =====
logging:
  level:
    root: INFO
    com.aid.train.backend: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG
    org.springframework.ai: DEBUG

# ===== SpringDoc Configuration =====
springdoc:
  api-docs:
    path: /api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
    # Cookie 인증 방식 지원
    persistent-authorization: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# ===== Scheduler Configuration =====
scheduler:
  cleanup:
    temporary-data-hours: ${SCHEDULER_CLEANUP_TEMPORARY_DATA_HOURS:1}
    refresh-token-days: ${SCHEDULER_CLEANUP_REFRESH_TOKEN_DAYS:14}

# ===== Profile-specific Configuration =====
---
spring:
  config:
    activate:
      on-profile: local

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: true

logging:
  level:
    com.aid.train.backend: DEBUG
    org.hibernate.SQL: DEBUG

decorator:
  datasource:
    p6spy:
      enable-logging: true
      multiline: true
      logging: slf4j

cookie:
  secure: false
  same-site: Lax

cors:
  allowed-origins: http://localhost:5050

---
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    com.aid.train.backend: INFO
    org.hibernate.SQL: INFO

cookie:
  secure: true
  same-site: Lax

cors:
  allowed-origins: http://localhost:5050,https://dialogym.shop,https://www.dialogym.shop

---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    hibernate:
      ddl-auto: update

logging:
  level:
    com.aid.train.backend: WARN
    org.hibernate.SQL: WARN

decorator:
  datasource:
    p6spy:
      enable-logging: false

cookie:
  secure: true
  same-site: None
  domain: .dialogym.shop

cors:
  allowed-origins: https://dialogym.shop,https://www.dialogym.shop